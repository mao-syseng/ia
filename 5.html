      body {

        font-weight: 400;
        font-style: normal;
        width: 21cm;
        height: 29.7cm;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: repeat(4, 1fr);
        gap: 0;
      }

      .page {
        border: 1px solid #ccc;
        padding: 1rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }

      .page-content {
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-columns: 0.75fr 1fr;
        grid-template-rows: 70px 70px 70px 70px;
        gap: 0;
        padding: 0.5rem;
      }

      .math-cell {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        background: white;
        padding: 0.5rem;
      }

      /* Rotate odd pages (left column) */
      .page:nth-child(odd) .page-content {
        transform: rotate(90deg);
      }

      /* Rotate even pages (right column) */
      .page:nth-child(even) .page-content {
        transform: rotate(-90deg);
      }

      .page {
        border: 1px solid #ddd;
        break-inside: avoid;
      }
    </style>
  </head>
