title: "Kalorie Tæller"
description: "Simpel kalorie tæller"
backLink: true
---

<div class="buy-page">
  <div class="buy-card">
    <div class="card-details">
      <h2>Kalorie Tæller</h2>

      <form id="calorieForm">
        <p>
          <label
            >Format: grams,kcal/100g[,buffer]<br />
            <input
              type="text"
              inputmode="decimal"
              id="calorieInput"
              placeholder="100,50"
              style="width: 100%"
          /></label>
        </p>
        <p>
          <button type="submit">Tilføj</button>
        </p>
      </form>

      <h3>Total: <span id="totalCalories">0</span> kcal</h3>

      <ul id="itemsList"></ul>
    </div>
  </div>
</div>

<script>
  const form = document.getElementById("calorieForm");
  const calorieInput = document.getElementById("calorieInput");
  const totalDisplay = document.getElementById("totalCalories");
  const itemsList = document.getElementById("itemsList");

  let items = [];

  form.addEventListener("submit", (e) => {
    e.preventDefault();

    const values = calorieInput.value.trim().split(',');

    if (values.length < 2) {
      alert("Format: grams,kcal/100g[,buffer]");
      return;
    }

    const grams = parseFloat(values[0]);
    const kcalPer100 = parseFloat(values[1]);
    const buffer = values[2] ? parseFloat(values[2]) : 0;

    if (isNaN(grams) || isNaN(kcalPer100)) {
      alert("Please enter valid numbers");
      return;
    }

    if (values[2] && isNaN(buffer)) {
      alert("Buffer must be a valid number");
      return;
    }

    const totalKcal = (grams * kcalPer100) / 100 + buffer;

    items.push({ grams, kcalPer100, buffer, totalKcal });

    updateDisplay();

    calorieInput.value = "";
    calorieInput.focus();
  });

  function updateDisplay() {
    const total = items.reduce((sum, item) => sum + item.totalKcal, 0);
    totalDisplay.textContent = Math.round(total);

    itemsList.innerHTML = items
      .map(
        (item, index) =>
          `<li onclick="removeItem(${index})">${item.grams}g × ${item.kcalPer100} kcal/100g ${item.buffer ? `+ ${item.buffer}` : ""} = ${Math.round(item.totalKcal)} kcal </li>`,
      )
      .join("");
  }

  function removeItem(index) {
    items.splice(index, 1);
    updateDisplay();
  }
</script>
